name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            artifact: zoder-macos-aarch64
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            artifact: zoder-macos-x86_64
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            artifact: zoder-linux-x86_64
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: zoder-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          src="target/${{ matrix.target }}/release/zoder"
          cp "$src" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/zoder-* install.sh \
            --title "$tag" \
            --generate-notes
